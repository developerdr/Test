jenkins:
  systemMessage: "Spring Boot + Karate demo"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  globalNodeProperties:
    - envVars:
        env:
          - key: "BLACKDUCK_URL"
            value: "${BLACKDUCK_URL:-}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: "blackduck-token"
              description: "Black Duck SCA API token"
              scope: GLOBAL
              secret: "${BLACKDUCK_API_TOKEN:-not-set}"

unclassified:
  location:
    url: "http://localhost:8090/"

jobs:
  - script: |
      pipelineJob('springboot-karate-demo') {
        description('Builds the app, runs Karate API tests, SAST (SpotBugs) and Black Duck scans, deploys on port 9091, then a Karate+Gatling load test')
        properties {
          pipelineTriggers {
            triggers {
              // poll GitHub every ~2 minutes; a new commit starts a build
              pollSCM { scmpoll_spec('H/2 * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/developerdr/Test.git') }
                branch('*/master')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
